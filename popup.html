<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 240px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 11px;
        color: #1a1a1a;
        background: #fff;
      }
      .header {
        padding: 10px 12px 8px;
        border-bottom: 0.5px solid #e0e0e0;
      }
      .header-title { font-size: 11px; font-weight: 600; }
      .header-sub { font-size: 10px; color: #888; margin-top: 2px; }
      .body { padding: 10px 12px; }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .row-label {
        font-size: 10px;
        color: #555;
      }
      .switch {
        position: relative;
        width: 38px;
        height: 22px;
        display: inline-block;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: #d6d6d6;
        border-radius: 999px;
        transition: background 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        left: 3px;
        top: 3px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .switch input:checked + .slider {
        background: #222;
      }
      .switch input:checked + .slider::before {
        transform: translateX(16px);
      }
      label {
        font-size: 10px;
        color: #888;
        display: block;
        margin-bottom: 4px;
      }
      .nav-actions {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 6px;
        align-items: center;
        margin-bottom: 10px;
      }
      .page-indicator {
        min-width: 54px;
        text-align: center;
        font-size: 10px;
        color: #666;
      }
      .count-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      .summary {
        margin-bottom: 10px;
        padding: 8px;
        border: 0.5px solid #e0e0e0;
        border-radius: 8px;
        background: #fafafa;
      }
      .summary-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 10px;
        color: #555;
      }
      .summary-row + .summary-row {
        margin-top: 4px;
      }
      .summary-value {
        color: #111;
        font-weight: 600;
      }
      input[type="number"] {
        width: 60px;
        height: 28px;
        font-size: 11px;
        border: 0.5px solid #ccc;
        border-radius: 6px;
        padding: 0 8px;
        outline: none;
      }
      input[type="number"]:focus { border-color: #888; }
      .unit { font-size: 10px; color: #888; }
      .actions { display: flex; flex-direction: column; gap: 6px; }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        width: 100%;
        height: 30px;
        border: 0.5px solid #ccc;
        border-radius: 6px;
        background: #fff;
        font-size: 11px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn:hover { background: #f5f5f5; }
      .btn:active { background: #ebebeb; transform: scale(0.98); }
      .btn:disabled {
        cursor: not-allowed;
        color: #aaa;
        background: #f7f7f7;
      }
      .btn:disabled:active {
        background: #f7f7f7;
        transform: none;
      }
      .btn svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
      }
      .btn-danger {
        border-color: #e2b4b4;
        color: #8f2d2d;
      }
      .btn-danger:hover { background: #fff4f4; }
      .btn-stop {
        margin-top: 10px;
        background: #f6f6f6;
      }
      .status {
        margin-top: 8px;
        min-height: 16px;
        font-size: 10px;
        color: #888;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-title">自動クリック</div>
    </div>
    <div class="body">
      <div class="row">
        <div class="row-label">自動実行</div>
        <label class="switch">
          <input type="checkbox" id="autoRun" checked />
          <span class="slider"></span>
        </label>
      </div>
      <div class="nav-actions" id="navActions" hidden>
        <button class="btn" id="prevPage">前</button>
        <div class="page-indicator" id="pageIndicator">-</div>
        <button class="btn" id="nextPage">次</button>
      </div>
      <div class="summary">
        <div class="summary-row">
          <span>スキ可能数</span>
          <span class="summary-value" id="likeCount">-</span>
        </div>
        <div class="summary-row">
          <span>フォロー可能数</span>
          <span class="summary-value" id="followCount">-</span>
        </div>
        <div class="summary-row">
          <span>フォロー解除推薦数</span>
          <span class="summary-value" id="unfollowCount">-</span>
        </div>
      </div>
      <label>実行件数</label>
      <div class="count-row">
        <input type="number" id="count" value="15" min="1" max="100" />
        <span class="unit">件まで</span>
      </div>
      <div class="actions">
        <button class="btn" id="like">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          スキを実行
        </button>
        <button class="btn" id="follow">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          フォローを実行
        </button>
        <button class="btn btn-danger" id="unfollow">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          フォロー外しを実行
        </button>
      </div>
      <button class="btn btn-stop" id="stop">実行を停止</button>
      <div class="status" id="status">待機中...</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
